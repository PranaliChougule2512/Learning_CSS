<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* transform */
  .container{
   display: flex;
   flex-wrap: wrap;
   justify-content: center;
   gap: 30px;
   padding-top: 50px;
  }
  .box{
   border: 10px;
   height: 250px ;
   width: 250px;
   display: flex;
   align-items:center;
   justify-content: center;
   color: white;
   font-size: 40px;
   transition: transform 2s ease-in;
  }
  .box1:hover{
    transform:translate(125px,125px);
  }
   .box2:hover{
    transform:translateX(125px);
  }
   .box3:hover{
    transform:translateY(125px);
  }
   .box4:hover{
    transform:rotate(720deg);
  }
  .box5:hover{
    transform:skewX(50deg);
  }
  .box6:hover{
    transform: scale(1.5);
  }
  .box7:hover{
    transform:rotate(40deg) scale(2) translate(200px)
  }
    </style>
</head>
 <body>
<!--div.container>div.box*7 -->
<div class="container">
    <div class="box box1">translate</div>
    <div class="box box2">translateX</div>
    <div class="box box3">translateY</div>
    <div class="box box4">rotate</div>
    <div class="box box5">skew</div>
    <div class="box box6">scale</div>
    <div class="box box7">multiple</div>
</div>

</body>
</html>
