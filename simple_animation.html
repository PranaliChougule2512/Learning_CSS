<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       /*animation */
  div{
   width: 200px;
   height: 200px;
   background-image: url(..//images/peacock.jpg);
   position: relative;
   border-radius: 20px;
   animation:movingbox;
   animation-duration: 5s;
   animation-iteration-count: infinite;
   animation-delay: 5s;
   animation-direction: alternate-reverse;
  }
  @keyframes movingbox{
   0%{background-image: url(../images/peacock.jpg);left:0px;top:0px}
   25%{background-image: url(../images/pinktheme.jpg);left:300px;top: 0px}
   50%{background-image:url(../images/moonlight.jpg);left: 300px;top:300px}
   75%{background-image: url(../images/tower.jpg);left: 0px;top: 300px;}
   100%{background-image: url(../images/peacock.jpg);left:0px;top:0px}
  }
  </style>
</head>
<body>
    <div>

    </div>
</body>
</html>
